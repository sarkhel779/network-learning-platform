name: Admin SQL authorization

on:
  pull_request:
    paths:
      - ".github/workflows/admin-sql.yml"
      - "supabase/migrations/**"
      - "supabase/tests/admin_foundation_rls.sql"
      - "tests/e2e/admin-live.spec.ts"
      - "playwright.admin.config.ts"
      - "src/app/admin/**"
      - "src/app/api/page-view/**"
      - "src/app/dashboard/**"
      - "src/features/admin/**"
      - "src/features/analytics/**"
      - "src/lib/env/public-env.ts"
      - "src/lib/supabase/**"

permissions:
  contents: read

jobs:
  admin-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Initialize disposable Supabase project
        run: supabase init

      - name: Start disposable Supabase services and apply migrations
        run: supabase start

      - name: Install PostgreSQL client if needed
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Verify admin authorization and RLS
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/admin_foundation_rls.sql

      - name: Seed disposable page-view ingest token
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 \
            -c "insert into public.page_view_ingest_config (singleton, token_hash) values (true, md5('ci-only-ingest-token-with-32-chars-minimum'))"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Export disposable Supabase keys for browser checks
        run: |
          while IFS='=' read -r name value; do
            case "$name" in
              NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|TEST_SUPABASE_SERVICE_ROLE_KEY)
                value="${value#\"}"
                value="${value%\"}"
                printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < <(supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=TEST_SUPABASE_SERVICE_ROLE_KEY)

      - name: Validate disposable browser configuration
        run: |
          test "${NEXT_PUBLIC_SUPABASE_URL:-}" = 'http://127.0.0.1:54321' || { echo 'Disposable API URL missing or unexpected'; exit 1; }
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" || { echo 'Disposable anon key missing'; exit 1; }
          test -n "${TEST_SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'Disposable service role key missing'; exit 1; }
          echo 'Disposable URL and keys are present'

      - name: Verify live staff and learner browser boundaries
        env:
          PAGE_VIEW_INGEST_TOKEN: ci-only-ingest-token-with-32-chars-minimum
        run: pnpm exec playwright test --config=playwright.admin.config.ts
